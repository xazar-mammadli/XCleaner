name: CI

on:
  pull_request:
  push:
    branches: [master]
    # Website-only pushes skip the build. Pull requests always run it, because master requires this check.
    paths-ignore: ['docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test the engine
        run: swift test --package-path Packages/CleanerCore

      - name: Build the app
        run: >
          xcodebuild -project XCleaner.xcodeproj -scheme XCleaner -configuration Debug
          -derivedDataPath .build/DerivedData build CODE_SIGNING_ALLOWED=NO
